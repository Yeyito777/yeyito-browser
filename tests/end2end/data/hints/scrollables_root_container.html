<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>scrollables root container</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    #scroll-root {
      box-sizing: border-box;
      height: 100vh;
      overflow-y: auto;
      outline: none;
      padding: 16px;
    }

    .spacer {
      height: 2400px;
      background: linear-gradient(#eee, #bbb);
    }
  </style>
</head>
<body>
  <div id="scroll-root" tabindex="-1">
    <p>This div is the actual page-level scroll container.</p>
    <div class="spacer"></div>
  </div>
</body>
</html>
