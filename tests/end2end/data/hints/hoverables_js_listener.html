<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>hoverables js listener</title>
  <style>
    #hover-me {
      width: 220px;
      height: 80px;
      margin: 40px;
      padding: 12px;
      background: #ddd;
      border: 1px solid #444;
    }
  </style>
</head>
<body>
  <div id="hover-me">hover target via addEventListener</div>
  <script>
    const target = document.getElementById('hover-me');
    target.addEventListener('mouseenter', () => {
      target.dataset.hovered = 'yes';
    });
  </script>
</body>
</html>
