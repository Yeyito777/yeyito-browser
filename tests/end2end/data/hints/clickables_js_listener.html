<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>clickables js listener</title>
  <style>
    #click-me {
      width: 220px;
      height: 80px;
      margin: 40px;
      padding: 12px;
      background: #ddd;
      border: 1px solid #444;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <span id="click-me">click target via addEventListener</span>
  <script>
    const target = document.getElementById('click-me');
    target.addEventListener('click', () => {
      target.dataset.clicked = 'yes';
    });
  </script>
</body>
</html>
