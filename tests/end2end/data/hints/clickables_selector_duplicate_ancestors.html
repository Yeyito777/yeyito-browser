<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>clickables selector duplicate ancestors</title>
  <style>
    #tree {
      width: 240px;
      padding: 8px;
      border: 1px solid #444;
    }
    #row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      cursor: pointer;
    }
    #icon {
      width: 24px;
      height: 24px;
      background: #999;
    }
  </style>
</head>
<body>
  <div id="tree" tabindex="0">
    <div id="row" role="treeitem">
      <img id="icon" alt="icon" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==">
      <span>Only one hint should be shown here</span>
    </div>
  </div>
</body>
</html>
